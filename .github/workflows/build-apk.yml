name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
          - all

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate debug keystore if absent
        run: |
          if [ ! -f debug.keystore ]; then
            echo "Generating debug.keystore for APK signing..."
            keytool -genkey -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Synchronize version with GitHub Run Number
        run: |
          RUN_NUM="${{ github.run_number }}"
          CODE_NUM=$((1000 + RUN_NUM))
          echo "Synchronizing version.properties with GitHub Workflow Run #$RUN_NUM (versionCode: $CODE_NUM)..."
          if [ -f app/version.properties ]; then
            sed -i "s/^versionBuild=.*/versionBuild=$RUN_NUM/" app/version.properties
            sed -i "s/^versionCode=.*/versionCode=$CODE_NUM/" app/version.properties
            cat app/version.properties
          fi

      - name: Build Debug APK
        if: ${{ github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'all' }}
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          echo "Building Debug APK for GitHub Run #${{ github.run_number }} (Version: 1.0.0.${{ github.run_number }})..."
          gradle :app:assembleDebug --stacktrace

      - name: Build Release APK
        if: ${{ github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'all' || github.event.inputs.build_type == '' }}
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          echo "Building Release APK for GitHub Run #${{ github.run_number }} (Version: 1.0.0.${{ github.run_number }})..."
          gradle :app:assembleRelease --stacktrace

      - name: Upload Debug APK Artifact
        if: ${{ github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'all' }}
        uses: actions/upload-artifact@v4
        with:
          name: investment-tracker-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Release APK Artifact
        if: ${{ github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'all' || github.event.inputs.build_type == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: investment-tracker-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
